name: CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs: tags can be moved, SHAs can't
# (setup-uv no longer publishes moving major tags at all).
jobs:
  lint:
    # A pull request from this repository runs on the same commit as its push, so skip the repeat.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked ruff format --check src tests
      - run: uv run --locked ruff check src tests

  test:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Full static FFmpeg 9.0 builds (x264, x265, vpx, opus, zimg) on every OS.
          # Linux and Windows get BtbN builds, named major.minor.
          - os: ubuntu-latest
            ffmpeg: "9.0"
          - os: windows-latest
            ffmpeg: "9.0"
          # macos-latest is Apple Silicon: OSXExperts builds, named without dots.
          - os: macos-latest
            ffmpeg: "9"
    env:
      SCENEFOLD_REQUIRE_FULL_FFMPEG: "1" # a missing FFmpeg feature fails instead of skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: AnimMouse/setup-ffmpeg@178e0b4a408f06ce40d896c3cd79f50fa6f8b0c3 # v1.2.5
        with:
          version: ${{ matrix.ffmpeg }}
      - run: ffmpeg -version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.15"
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run --locked pytest -ra
